<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Montserrat:wght@400;500&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', 'Spectral', 'Trajan Pro', serif;
        font-size: 64px;
        font-weight: 500;
        letter-spacing: 0.16em;
        fill: url(#goldGradient);
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Manrope', sans-serif;
        font-size: 21px;
        font-weight: 400;
        letter-spacing: 0.38em;
        fill: url(#goldGradient);
      }
    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAD37E"/>
      <stop offset="45%" stop-color="#EAA640"/>
      <stop offset="100%" stop-color="#DF952E"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 0)">
    <!-- YULIIA -->
    <text x="240" y="70" text-anchor="middle" class="brand-title">YULIIA</text>
    <!-- PIKHOTSKA -->
    <text x="240" y="112" text-anchor="middle" class="brand-subtitle">PIKHOTSKA</text>
  </g>
</svg>
